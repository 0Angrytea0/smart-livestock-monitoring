services:
  zookeeper:
    container_name: zookeeper
    image: zookeeper:3.9
    ports:
    - 2181:2181
  kafka:
    container_name: kafka
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
    - zookeeper
    ports:
    - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test:
      - CMD-SHELL
      - kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1 ||
        exit 1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
  kafka-init:
    container_name: kafka-init
    build:
      context: .
      dockerfile: infra/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
  minio:
    container_name: minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
    - 9000:9000
    - 9001:9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
    - ./data/minio:/data
  create-bucket:
    container_name: create-bucket
    image: minio/mc:latest
    depends_on:
    - minio
    entrypoint: '/bin/sh -c " until mc alias set local http://minio:9000 minioadmin
      minioadmin; do sleep 2; done && mc mb -p local/warehouse || true "

      '
  clickhouse:
    container_name: clickhouse
    image: clickhouse/clickhouse-server:24.8
    ports:
    - 8123:8123
    - 9002:9000
    environment:
      CLICKHOUSE_DB: livestock
      CLICKHOUSE_USER: livestock
      CLICKHOUSE_PASSWORD: livestock123
    volumes:
    - clickhouse_data:/var/lib/clickhouse
    - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test:
      - CMD-SHELL
      - clickhouse-client --user livestock --password livestock123 --query 'SELECT
        1' > /dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
  spark-bronze:
    container_name: spark-bronze
    build:
      context: .
      dockerfile: spark/Dockerfile
    user: root
    depends_on:
      create-bucket:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      HADOOP_USER_NAME: root
    volumes:
    - ./data/checkpoints:/opt/spark/checkpoints
    command:
    - /opt/spark/bin/spark-submit
    - --jars
    - /opt/spark/jars_external/aws-java-sdk-bundle-1.11.1026.jar,/opt/spark/jars_external/hadoop-aws-3.3.2.jar,/opt/spark/jars_external/iceberg-spark-runtime-3.3_2.12-1.8.1.jar,/opt/spark/jars_external/spark-sql-kafka-0-10_2.12-3.3.1.jar,/opt/spark/jars_external/spark-token-provider-kafka-0-10_2.12-3.3.1.jar,/opt/spark/jars_external/kafka-clients-2.8.1.jar,/opt/spark/jars_external/commons-pool2-2.11.1.jar
    - /app/bronze_consumer.py
    healthcheck:
      test:
      - CMD-SHELL
      - test -f /tmp/bronze_ready
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
  spark-silver-light:
    container_name: spark-silver-light
    build:
      context: .
      dockerfile: spark/Dockerfile
    user: root
    depends_on:
      create-bucket:
        condition: service_completed_successfully
      spark-bronze:
        condition: service_healthy
    environment:
      HADOOP_USER_NAME: root
      SILVER_SENSORS: cbt,ankle,uwb,milk,thi
      SILVER_TRIGGER_INTERVAL: 15 seconds
      SILVER_MODE: valid
    volumes:
    - ./data/checkpoints:/opt/spark/checkpoints
    command:
    - /opt/spark/bin/spark-submit
    - --driver-memory
    - 4g
    - --conf
    - spark.executor.memory=4g
    - --conf
    - spark.executor.memoryOverhead=1g
    - --conf
    - spark.sql.shuffle.partitions=4
    - --conf
    - spark.default.parallelism=4
    - --conf
    - spark.sql.files.maxPartitionBytes=33554432
    - --jars
    - /opt/spark/jars_external/aws-java-sdk-bundle-1.11.1026.jar,/opt/spark/jars_external/hadoop-aws-3.3.2.jar,/opt/spark/jars_external/iceberg-spark-runtime-3.3_2.12-1.8.1.jar,/opt/spark/jars_external/spark-sql-kafka-0-10_2.12-3.3.1.jar,/opt/spark/jars_external/spark-token-provider-kafka-0-10_2.12-3.3.1.jar,/opt/spark/jars_external/kafka-clients-2.8.1.jar,/opt/spark/jars_external/commons-pool2-2.11.1.jar
    - /app/silver_consumer.py
    healthcheck:
      test:
      - CMD-SHELL
      - test -f /tmp/silver_ready
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
  spark-silver-heavy:
    container_name: spark-silver-heavy
    build:
      context: .
      dockerfile: spark/Dockerfile
    user: root
    depends_on:
      create-bucket:
        condition: service_completed_successfully
      spark-bronze:
        condition: service_healthy
    environment:
      HADOOP_USER_NAME: root
      SILVER_SENSORS: immu,pressure
      SILVER_TRIGGER_INTERVAL: 30 seconds
      SILVER_MODE: valid
    volumes:
    - ./data/checkpoints:/opt/spark/checkpoints
    command:
    - /opt/spark/bin/spark-submit
    - --driver-memory
    - 5g
    - --conf
    - spark.executor.memory=5g
    - --conf
    - spark.executor.memoryOverhead=2g
    - --conf
    - spark.sql.shuffle.partitions=4
    - --conf
    - spark.default.parallelism=4
    - --conf
    - spark.sql.files.maxPartitionBytes=33554432
    - --jars
    - /opt/spark/jars_external/aws-java-sdk-bundle-1.11.1026.jar,/opt/spark/jars_external/hadoop-aws-3.3.2.jar,/opt/spark/jars_external/iceberg-spark-runtime-3.3_2.12-1.8.1.jar,/opt/spark/jars_external/spark-sql-kafka-0-10_2.12-3.3.1.jar,/opt/spark/jars_external/spark-token-provider-kafka-0-10_2.12-3.3.1.jar,/opt/spark/jars_external/kafka-clients-2.8.1.jar,/opt/spark/jars_external/commons-pool2-2.11.1.jar
    - /app/silver_consumer.py
    healthcheck:
      test:
      - CMD-SHELL
      - test -f /tmp/silver_ready
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
  spark-silver-quarantine:
    container_name: spark-silver-quarantine
    build:
      context: .
      dockerfile: spark/Dockerfile
    user: root
    depends_on:
      create-bucket:
        condition: service_completed_successfully
      spark-bronze:
        condition: service_healthy
    environment:
      HADOOP_USER_NAME: root
      SILVER_MODE: quarantine
      SILVER_SENSORS: cbt,ankle,uwb,milk,thi,immu,pressure
      SILVER_TRIGGER_INTERVAL: 20 seconds
      SILVER_QUARANTINE_TABLE: iceberg.silver_quarantine
    volumes:
    - ./data/checkpoints:/opt/spark/checkpoints
    command:
    - /opt/spark/bin/spark-submit
    - --driver-memory
    - 5g
    - --conf
    - spark.executor.memory=5g
    - --conf
    - spark.executor.memoryOverhead=2g
    - --conf
    - spark.sql.shuffle.partitions=4
    - --conf
    - spark.default.parallelism=4
    - --conf
    - spark.sql.files.maxPartitionBytes=33554432
    - --jars
    - /opt/spark/jars_external/aws-java-sdk-bundle-1.11.1026.jar,/opt/spark/jars_external/hadoop-aws-3.3.2.jar,/opt/spark/jars_external/iceberg-spark-runtime-3.3_2.12-1.8.1.jar,/opt/spark/jars_external/spark-sql-kafka-0-10_2.12-3.3.1.jar,/opt/spark/jars_external/spark-token-provider-kafka-0-10_2.12-3.3.1.jar,/opt/spark/jars_external/kafka-clients-2.8.1.jar,/opt/spark/jars_external/commons-pool2-2.11.1.jar
    - /app/silver_consumer.py
    healthcheck:
      test:
      - CMD-SHELL
      - test -f /tmp/silver_quarantine_ready
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
  spark-gold:
    container_name: spark-gold
    build:
      context: .
      dockerfile: spark/Dockerfile
    user: root
    depends_on:
      create-bucket:
        condition: service_completed_successfully
      spark-silver-light:
        condition: service_healthy
      spark-silver-heavy:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      spark-silver-quarantine:
        condition: service_healthy
    environment:
      HADOOP_USER_NAME: root
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: '8123'
      CLICKHOUSE_USERNAME: livestock
      CLICKHOUSE_PASSWORD: livestock123
      CLICKHOUSE_DATABASE: livestock
      GOLD_TRIGGER_INTERVAL: 30 seconds
      TEMP_HIGH: '39.5'
      TEMP_CRITICAL: '40.5'
      LONG_LYING_MINUTES_3H: '150'
      LONG_LYING_CRITICAL_MINUTES_3H: '180'
      LOW_ACTIVITY_DISTANCE_M_6H: '50'
      LOW_ACTIVITY_CRITICAL_DISTANCE_M_6H: '20'
      THI_WARNING: '68'
      THI_DANGER: '72'
      USE_HEAD_DOWN_EXPERIMENTAL: 'false'
    volumes:
    - ./data/checkpoints:/opt/spark/checkpoints
    command:
    - /opt/spark/bin/spark-submit
    - --driver-memory
    - 2g
    - --conf
    - spark.executor.memory=2g
    - --conf
    - spark.executor.memoryOverhead=512m
    - --conf
    - spark.sql.shuffle.partitions=8
    - --conf
    - spark.default.parallelism=4
    - --conf
    - spark.sql.files.maxPartitionBytes=33554432
    - --jars
    - /opt/spark/jars_external/aws-java-sdk-bundle-1.11.1026.jar,/opt/spark/jars_external/hadoop-aws-3.3.2.jar,/opt/spark/jars_external/iceberg-spark-runtime-3.3_2.12-1.8.1.jar,/opt/spark/jars_external/spark-sql-kafka-0-10_2.12-3.3.1.jar,/opt/spark/jars_external/spark-token-provider-kafka-0-10_2.12-3.3.1.jar,/opt/spark/jars_external/kafka-clients-2.8.1.jar,/opt/spark/jars_external/commons-pool2-2.11.1.jar
    - /app/gold_consumer.py
    healthcheck:
      test:
      - CMD-SHELL
      - test -f /tmp/gold_ready
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
  producer:
    container_name: producer
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      spark-bronze:
        condition: service_healthy
      spark-silver-light:
        condition: service_healthy
      spark-silver-heavy:
        condition: service_healthy
      spark-gold:
        condition: service_healthy
      spark-silver-quarantine:
        condition: service_healthy
    volumes:
    - ./data:/app/data
  ui:
    container_name: ui
    build:
      context: .
      dockerfile: ui/Dockerfile
    depends_on:
      clickhouse:
        condition: service_healthy
      spark-gold:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: '8123'
      CLICKHOUSE_USERNAME: livestock
      CLICKHOUSE_PASSWORD: livestock123
      CLICKHOUSE_DATABASE: livestock
      UI_REFRESH_MS: '30000'
    ports:
    - 8501:8501
volumes:
  clickhouse_data: null
  clickhouse_logs: null
